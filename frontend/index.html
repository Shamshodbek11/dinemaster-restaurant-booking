    <script>
      // Sahifa yuklanguncha to'g'ri tema (oq/qora "chaqnash" bo'lmasin)
      try {
        var m = localStorage.getItem('dm-theme');
        if (!m) { var l = localStorage.getItem('dm-dark'); if (l !== null) m = l === 'true' ? 'dark' : 'light'; }
        var dark = m === 'dark' || ((!m || m === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
